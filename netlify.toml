[build]
  command = "npm run build"
  publish = ".next"
  # Skip the build (exit 0) when a push only touches files the site never
  # reads: agent logs, the feature tracker, docs and Claude config. Any real
  # change, a missing cached ref, or an empty ref forces a build (exit 1/128).
  ignore = '[ -z "$CACHED_COMMIT_REF" ] || [ "$CACHED_COMMIT_REF" = "$COMMIT_REF" ] && exit 1; git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . ":!.agent-logs" ":!.claude" ":!feature_list.json" ":!*.md"'

[build.environment]
  NODE_VERSION = "22"

# Declared explicitly: auto-detection did not run on this site, which left the
# raw .next folder deployed as static files (every route 404'd).
[[plugins]]
  package = "@netlify/plugin-nextjs"
